# Render Blueprint: New > Blueprint, pick this repository, Apply.  Free plan: the server sleeps after 15 idle minutes and starts
# again on the next visit (about a minute), and what the table has saved (players, matches) is lost when it restarts.
services:
  - type: web
    name: neutral-ground
    runtime: node
    plan: free
    buildCommand: echo "nothing to build"
    startCommand: node start.js
    healthCheckPath: /healthz
    envVars:
      - key: ARENA_HOUSE
        value: Written rule,Follow the ball,Model X,Claude Haiku 5.5,Claude Sonnet 5.5,Claude Opus 5.5,Claude Fable 5.2
      - key: ARENA_PAUSE
        value: "20"
